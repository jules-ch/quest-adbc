services:
  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "9009:9009"
      - "8812:8812"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9000/exec?query=select%201' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
